<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Human Capital Portal</title>
    <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
    <main class="auth-shell">
        <section class="panel auth-panel">
            <h1>Login</h1>
            <p>Masuk dengan akun internal yang sudah diberi role.</p>
            {% if form.errors %}
                <div class="message">Username atau password tidak valid.</div>
            {% endif %}
            <form method="post" class="form-grid">
                {% csrf_token %}
                {{ form.as_p }}
                <button class="button primary" type="submit">Masuk</button>
            </form>
        </section>
    </main>
</body>
</html>
